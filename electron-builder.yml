appId: com.ledgerlift.app
productName: Ledger Lift
copyright: Ledger Lift
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
publish: null
mac:
  category: public.app-category.productivity
  target: dmg
  identity: null # unsigned for now; see README
dmg:
  artifactName: Ledger-Lift-${version}-${arch}.${ext}
win:
  target: nsis
nsis:
  artifactName: Ledger-Lift-${version}-setup.${ext}
linux:
  target: AppImage
  category: Office
  artifactName: Ledger-Lift-${version}.${ext}
