<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice ledger page</title>
<style>
  @page { size: A4; margin: 14mm; }
  body { font: 14px/1.4 system-ui, sans-serif; color: #111; margin: 0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #444; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #333; text-align: left; padding: 0 8px; }
  th { background: #eee; height: 30px; font-size: 13px; }
  td { height: 40px; }
  th:nth-child(1), td:nth-child(1) { width: 18%; }
  th:nth-child(3), td:nth-child(3) { width: 18%; }
  th:nth-child(4), td:nth-child(4) { width: 18%; }
  .note { font-size: 12px; margin-top: 10px; color: #666; }
  @media print { .note { display: none; } }
</style>
</head>
<body>
<h1>Daily sales</h1>
<p>Date: ____________________</p>
<table>
  <thead><tr><th>Date</th><th>Item</th><th>Quantity</th><th>Amount</th></tr></thead>
  <tbody>
    <tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td><td></td></tr>
  </tbody>
</table>
<p class="note">Print this page (Ctrl+P / Cmd+P). It fits 15 rows, so one practice set fills one page. Plain lined paper works too.</p>
</body>
</html>
